<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6fc0"/>
      <stop offset="1" stop-color="#1b4e8c"/>
    </linearGradient>
  </defs>

  <!-- game board -->
  <rect x="8" y="8" width="112" height="112" rx="16" fill="url(#boardGrad)"/>
  <rect x="8" y="8" width="112" height="112" rx="16" fill="none" stroke="#123a66" stroke-width="2"/>
  <rect x="16" y="11" width="96" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
  <rect x="16" y="111" width="96" height="6" rx="3" fill="#0c2c50" opacity="0.25"/>

  <!-- tile drop shadows -->
  <g fill="#0c2c50" opacity="0.45">
    <rect x="15" y="42.6" width="20" height="20" rx="4.5"/>
    <rect x="41" y="42.6" width="20" height="20" rx="4.5"/>
    <rect x="67" y="42.6" width="20" height="20" rx="4.5"/>
    <rect x="93" y="42.6" width="20" height="20" rx="4.5"/>
    <rect x="15" y="68.6" width="20" height="20" rx="4.5"/>
    <rect x="41" y="68.6" width="20" height="20" rx="4.5"/>
    <rect x="67" y="68.6" width="20" height="20" rx="4.5"/>
    <rect x="93" y="68.6" width="20" height="20" rx="4.5"/>
  </g>

  <!-- letter tiles (2x4 grid) -->
  <g fill="#f7fafd">
    <rect x="15" y="41" width="20" height="20" rx="4.5"/>
    <rect x="41" y="41" width="20" height="20" rx="4.5"/>
    <rect x="67" y="41" width="20" height="20" rx="4.5"/>
    <rect x="93" y="41" width="20" height="20" rx="4.5"/>
    <rect x="15" y="67" width="20" height="20" rx="4.5"/>
    <rect x="41" y="67" width="20" height="20" rx="4.5"/>
    <rect x="67" y="67" width="20" height="20" rx="4.5"/>
    <rect x="93" y="67" width="20" height="20" rx="4.5"/>
  </g>

  <!-- tile bottom bevels -->
  <g fill="#c3d5e8" opacity="0.9">
    <rect x="16.6" y="57.8" width="16.8" height="1.7" rx="0.85"/>
    <rect x="42.6" y="57.8" width="16.8" height="1.7" rx="0.85"/>
    <rect x="68.6" y="57.8" width="16.8" height="1.7" rx="0.85"/>
    <rect x="94.6" y="57.8" width="16.8" height="1.7" rx="0.85"/>
    <rect x="16.6" y="83.8" width="16.8" height="1.7" rx="0.85"/>
    <rect x="42.6" y="83.8" width="16.8" height="1.7" rx="0.85"/>
    <rect x="68.6" y="83.8" width="16.8" height="1.7" rx="0.85"/>
    <rect x="94.6" y="83.8" width="16.8" height="1.7" rx="0.85"/>
  </g>

  <!-- the marked tile: letter "O" with corner value "1" -->
  <circle cx="50.6" cy="50" r="5.2" fill="none" stroke="#1b4e8c" stroke-width="2.8"/>
  <path d="M57 55.5 l2 -1.5 v5" fill="none" stroke="#1b4e8c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
